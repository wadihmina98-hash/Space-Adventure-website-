<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Adventure - Play Online</title>
    <style>
        /* Base Styling & Background */
        body {
            background-color: #050510;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animated Deep Space Stars */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            animation: spaceScroll 120s linear infinite;
            z-index: 1;
            opacity: 0.6;
        }

        @keyframes spaceScroll {
            from { transform: translateY(0); }
            to { transform: translateY(-50%); }
        }

        /* Neon Glowing Game Container */
        .game-card {
            background: rgba(15, 15, 35, 0.75);
            border: 2px solid #00d2ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 450px;
            width: 90%;
            backdrop-filter: blur(10px);
            z-index: 10;
            box-sizing: border-box;
        }

        /* Sci-Fi Titles */
        h1 {
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 10px;
            letter-spacing: 2px;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
        }

        p {
            color: #b0b5cf;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* Neon Launch Button */
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
            color: #ffffff;
            font-weight: bold;
            font-size: 1.3rem;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 50px;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.4);
            transition: all 0.3s ease;
        }

        /* Interactive Tap Effect */
        .btn:active {
            transform: scale(0.96);
            box-shadow: 0 0 20px #00d2ff;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>SPACE ADVENTURE</h1>
        <p>Blast off into the ultimate cosmic journey! Pilot your starship, dodge obstacles, and survive the infinite reaches of deep galaxy territory.</p>
    
        <a href="https://gd.games" class="btn">LAUNCH GAME</a>
    </div>

</body>
</html>
