<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #05050f;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .summary {
            font-size: 1.1rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .play-btn {
            display: inline-block;
            background: linear-gradient(135deg, #00f0ff, #0072ff);
            color: #000000;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 700;
            padding: 16px 40px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transition: all 0.2s ease;
            margin-bottom: 25px;
        }

        .play-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.7);
        }

        .controls {
            font-size: 0.9rem;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 20px;
            line-height: 1.6;
        }

        strong {
            color: #00f0ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Space Adventure</h1>
        
        <p class="summary">
            Pilot your spaceship through an intense combat zone and shoot down 20 enemies to win the game!
        </p>

        <a href="https://gd.games" target="_blank" class="play-btn">🎮 Play Game Now</a>

        <p class="controls">
            <strong>PC:</strong> Use Arrow keys to move and Spacebar to shoot. <br>
            <strong>Mobile:</strong> Shoot with left-side X, and move using right-side buttons (Y: up, A: down, X: left, B: right).
        </p>
    </div>

</body>
</html>
